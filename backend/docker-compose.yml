version: "3.8"
services:
  db:
    image: mysql:latest
    container_name: my_database
    env_file:
      - .env
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - app_network
    ports:
      - "3306:3306"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost"]
      interval: 30s
      timeout: 10s
      retries: 5
  redis:
    image: redis:7-alpine
    container_name: springboot-redis
    ports:
      - "6379:6379"
    restart: unless-stopped
volumes:
  db_data:
    driver: local
networks:
  app_network:
    driver: bridge